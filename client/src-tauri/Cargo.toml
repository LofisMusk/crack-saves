[package]
name = "cracked-saves"
version = "0.1.0"
description = "Cracked Saves - client for managing cracked game saves"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.34"
notify = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[profile.release]
strip = true
panic = "abort"
codegen-units = 1
lto = true

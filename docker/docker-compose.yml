# Standalone server. To front it with Traefik instead of publishing port 8090,
# drop the `ports:` block and add labels + external network:
#
#   service: ...
#     labels:
#       subdomain: saves
#       traefik.http.services.saves.loadbalancer.server.port: "8090"
#     networks: [default, proxy]
#   networks:
#     proxy:
#       external: true
#
# then reach the API at http://saves.home (or your domain).

services:
  cracked-saves:
    build:
      context: ../server
      dockerfile: ../docker/Dockerfile
    image: cracked-saves/server:latest
    container_name: cracked-saves
    ports:
      - "8090:8090"
    environment:
      # Leave empty to disable auth (trusted LAN). Set a random string to enable.
      CS_API_TOKEN: ${CS_API_TOKEN:-}
      CS_DATA_DIR: /data
      CS_PORT: 8090
    volumes:
      - cracked-saves-data:/data
    restart: unless-stopped

volumes:
  cracked-saves-data:

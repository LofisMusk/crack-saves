name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

# Docker images are pushed to GitHub Container Registry.
permissions:
  contents: write
  packages: write

env:
  # Tag as given, e.g. "v0.1.0". Must match the version in client/package.json,
  # client/src-tauri/tauri.conf.json and client/src-tauri/Cargo.toml.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # GHCR image names must be fully lowercase.
  IMAGE_REPO: ghcr.io/lofismusk/crack-saves/server

jobs:
  client:
    name: Client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Native arch per runner (macos-latest is arm64).
        include:
          - os: macos-latest
            arch: aarch64-apple-darwin
          - os: windows-latest
            arch: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            arch: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      # Builds the release bundles and uploads them to a single GitHub Release
      # named after RELEASE_TAG (created by whichever job finishes first).
      - name: Build & upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Cracked Saves ${{ env.RELEASE_TAG }}
          includeUpdaterJson: false
          retryAttempts: 5

  server-docker:
    name: Server (Docker -> GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_REPO }}:latest
